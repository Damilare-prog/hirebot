version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: hirebot
      POSTGRES_PASSWORD: hirebot
      POSTGRES_DB: hirebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hirebot:hirebot@db:5432/hirebot
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-dev-key}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # scraper:
  #   build:
  #     context: ./scraper
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - api
  #     - redis
  #   environment:
  #     - API_BASE_URL=http://api:8000
  #     - SCRAPER_API_KEY=${SCRAPER_API_KEY:-dev-key}
  #     - REDIS_URL=redis://redis:6379
  #   volumes:
  #     - ./scraper:/app

volumes:
  pgdata:
